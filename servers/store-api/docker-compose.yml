version: '3.9'

services:
  store-api-db:
    image: postgres:17
    container_name: store-api-db
    environment:
      POSTGRES_USER: storeuser
      POSTGRES_PASSWORD: storepass
      POSTGRES_DB: storedb
    ports:
      - '5432:5432'
    volumes:
      - store-api-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  store-api-data:
