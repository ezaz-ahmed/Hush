# Air configuration for hot reload during development
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ./cmd/store-api"
  delay = 1000
  exclude_common_reexec = false
  exclude_dir = ["assets", "tmp", "vendor", "migrations"]
  exclude_extensions = ["so", "o", "a", "exe", "test", "w"]
  exclude_plain = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  full_bin = ""
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_dir = []
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
